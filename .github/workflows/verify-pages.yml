name: Verify Pages

on:
  push:
    branches:
      - fix/pages-reliability
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler: '2.4.22'
          bundler-cache: true

      - name: Run Python tests
        env:
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -e -o pipefail
          PYTHONDONTWRITEBYTECODE=1 bundle exec python3 -m unittest discover -s tests -v 2>&1 | tee python-tests.log

      - name: Run Node tests
        shell: bash
        run: |
          set -e -o pipefail
          {
            node tests/serialization.cjs
            node tests/wiki-resolution.cjs
          } 2>&1 | tee node-tests.log

      - name: Build Jekyll
        shell: bash
        run: |
          set -o pipefail
          bundle exec jekyll build --destination _site 2>&1 | tee jekyll-build.log

      - name: Check generated site
        run: python3 scripts/check_generated.py _site --manifest scripts/publication-manifest.json --output generated-check.json

      - name: Report failure annotations
        if: failure()
        shell: bash
        run: |
          python3 -B - <<'PYREPORT'
          import json
          import re
          from pathlib import Path

          remaining = 2500

          def emit(message):
              global remaining
              # Cap the escaped payload; never split a workflow-command escape.
              parts, size = [], 0
              for char in message:
                  part = {'%': '%25', '\r': '%0D', '\n': '%0A'}.get(char, char)
                  if size + len(part) + len('::error::') + 1 > remaining:
                      break
                  parts.append(part)
                  size += len(part)
              if parts:
                  print('::error::' + ''.join(parts))
                  remaining -= size + len('::error::') + 1

          def path_only(value):
              # Paths only: strip URL queries/fragments and control characters.
              return re.sub(r'[\x00-\x1f\x7f<>]', '', value.split('?', 1)[0].split('#', 1)[0])[:500]

          tests = Path('python-tests.log')
          if tests.is_file():
              diagnostics = []
              # Match diagnostic records only; never echo traceback source lines,
              # assertion HTML diffs, or arbitrary note bodies.
              for line in tests.read_text(errors='replace').splitlines():
                  line = re.sub(r'\x1b\[[0-9;]*m', '', line)
                  summary = re.match(r'^(?:FAILED\b.*|(?:ERROR|FAIL): .+)$', line)
                  frame = re.match(r'^\s*File "([^"]+)", line (\d+)', line)
                  ruby = re.search(r"(?:^|:\s+|\sfrom\s+)([^\s]+\.rb):(\d+):[^\n]*", line)
                  exception = re.match(r'^(?:[\w.]*Error|[\w.]*Exception|LoadError|LiquidSyntaxError|NoMethodError)(?::|$)', line)
                  if summary:
                      diagnostics.append((0, summary.group(0)[:250]))
                  elif frame:
                      diagnostics.append((2, 'File ' + path_only(frame.group(1)) + ':' + frame.group(2)))
                  elif ruby or (exception and 'tests/fixtures/' in line):
                      # Ruby stderr is carried inside the Python assertion. Keep
                      # its error record and frames, including controlled fixtures.
                      if exception:
                          diagnostics.append((1, exception.group(0).rstrip(':')))
                      record = line[ruby.start(1):] if ruby else line
                      diagnostics.append((1 if re.search(r'(?:Error|Exception)\b', record) else 2, record[:400]))
                  elif exception:
                      # Exception values can contain entire rendered note bodies.
                      # Keep the class and safe interpreter/API diagnostic text.
                      detail = re.search(r"(?:cannot load such file|undefined (?:method|local variable)|wrong number of arguments|Unknown tag|Liquid syntax error)[^<>\n]{0,180}", line, re.I)
                      diagnostics.append((1, exception.group(0).rstrip(':') + (': ' + detail.group(0) if detail else '')))
              for _, diagnostic in sorted(dict.fromkeys(diagnostics), key=lambda record: record[0]):
                  emit('Python: ' + diagnostic)
              if not diagnostics:
                  emit('Python: no recognized failure records; inspect python-tests.log artifact.')

          log = Path('jekyll-build.log')
          result = Path('generated-check.json')
          if not tests.is_file() and not log.is_file() and not result.is_file():
              emit('故障步骤尚未有构建产物')
          if log.is_file():
              errors = []
              for line in log.read_text(errors='replace').splitlines():
                  line = re.sub(r'\x1b\[[0-9;]*m', '', line)
                  match = re.search(r'Liquid (?:Exception|Error|syntax error)|\b(?:[\w:]*Exception|[\w:]*Error)\s*:', line, re.I)
                  if not match:
                      continue
                  # Do not publish arbitrary exception text or source excerpts.
                  summary = match.group(0).rstrip(':')
                  location = re.search(r'\bin\s+([\w./%+@()\-\u0080-\uffff]+)(?::(\d+))?\s*$', line)
                  if location:
                      summary += ' in ' + path_only(location.group(1))
                      if location.group(2):
                          summary += ':' + location.group(2)
                  missing = re.search(r"(?:Could not locate|No such file or directory|File not found)[^'\"\n]*['\"]([^'\"\n]+)['\"]", line, re.I)
                  if missing:
                      summary += '; missing resource: ' + path_only(missing.group(1))
                  tag = re.search(r"Unknown tag:\s*['\"]([\w-]+)['\"]", line, re.I)
                  if tag:
                      summary += '; unknown tag: ' + tag.group(1)
                  errors.append(summary[:300])
              if errors:
                  emit('Jekyll: ' + errors[0])
                  emit('Jekyll remaining errors: ' + str(len(errors) - 1))
              else:
                  emit('Jekyll log has no explicit Liquid/Exception/Error summary; inspect failed step.')
          if result.is_file():
              try:
                  errors = json.loads(result.read_text())['errors']
                  if not isinstance(errors, list):
                      raise ValueError()
                  prefixes = ('missing HTML: ', 'missing search: ', 'missing notes listing: ',
                              'private exposed: ', 'template/Google: ', 'missing resource: ',
                              'invalid built JS: ')
                  for error in errors[:20]:
                      if isinstance(error, str) and error.startswith(prefixes):
                          prefix = next(p for p in prefixes if error.startswith(p))
                          emit('Generated: ' + prefix + path_only(error[len(prefix):]))
                      elif error == 'missing or invalid SearchData.json':
                          emit('Generated: missing or invalid SearchData.json')
                      else:
                          emit('Generated: unrecognized error format; details withheld')
                  emit('Generated remaining errors: ' + str(max(0, len(errors) - 20)))
              except (OSError, ValueError, KeyError, TypeError):
                  emit('Generated: invalid generated-check.json')
          PYREPORT

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pages-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            python-tests.log
            node-tests.log
            jekyll-build.log
            generated-check.json
            _site/
          if-no-files-found: warn
          retention-days: 7
